<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" rx="24" fill="#101827" />
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.h{font-size:27px;font-weight:700;fill:#f8fafc}.s{font-size:15px;fill:#9eacc3}.t{font-size:16px;font-weight:700;fill:#edf4ff}.b{font-size:13px;fill:#aabbd4}.n{font-size:16px;font-weight:700;fill:#80aeff}.note{font-size:14px;fill:#b8c6d8}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7199d4" /></marker></defs>
<text x="38" y="53" class="h" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#f8fafc" font-weight="700">Ренессанс · согласование счетов</text>
<text x="38" y="84" class="s" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#9eacc3" font-weight="400">Три workflow: приём, решение и реестр. Основные данные хранятся в PostgreSQL.</text>
<rect x="25" y="118" width="1150" height="201" rx="16" fill="#142036" stroke="#243650" />
<text x="42" y="149" class="n" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#80aeff" font-weight="700">01  Приём счёта</text>
<rect x="42" y="166" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="55" y="197" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Gmail → PDF</text>
<text x="55" y="221" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Письмо REN-DEMO</text>
<text x="55" y="241" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Первое вложение</text>
<rect x="268" y="166" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="281" y="197" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">ИИ → JSON</text>
<text x="281" y="221" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Извлечение полей</text>
<text x="281" y="241" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">По JSON Schema</text>
<path d="M245 213 L264 213" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="494" y="166" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="507" y="197" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Проверки</text>
<text x="507" y="221" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Поля, ИНН поставщика</text>
<text x="507" y="241" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Банковский счёт</text>
<path d="M471 213 L490 213" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="720" y="166" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="733" y="197" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">PostgreSQL</text>
<text x="733" y="221" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Создать или обновить</text>
<text x="733" y="241" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Версия + pending</text>
<path d="M697 213 L716 213" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="946" y="166" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="959" y="197" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Telegram</text>
<text x="959" y="221" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Карточка счёта</text>
<text x="959" y="241" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Две кнопки решения</text>
<path d="M923 213 L942 213" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<text x="42" y="293" class="note" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#b8c6d8" font-weight="400">Не пройдены проверки → ручная проверка. Точный дубль → остановка.</text>
<rect x="25" y="355" width="1150" height="201" rx="16" fill="#142036" stroke="#243650" />
<text x="42" y="386" class="n" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#80aeff" font-weight="700">02  Решение по счёту</text>
<rect x="42" y="403" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="55" y="434" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Нажатие кнопки</text>
<text x="55" y="458" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Telegram Trigger</text>
<text x="55" y="478" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Получает callback_query</text>
<rect x="268" y="403" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="281" y="434" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Доступ и формат</text>
<text x="281" y="458" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Пользователь + чат</text>
<text x="281" y="478" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Разобрать ID и версию</text>
<path d="M245 450 L264 450" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="494" y="403" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="507" y="434" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Условия в SQL</text>
<text x="507" y="458" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">ID + версия совпали</text>
<text x="507" y="478" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Статус pending</text>
<path d="M471 450 L490 450" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="720" y="403" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="733" y="434" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Сохранить решение</text>
<text x="733" y="458" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">approved / rejected</text>
<text x="733" y="478" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Кто принял и когда</text>
<path d="M697 450 L716 450" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="946" y="403" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="959" y="434" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Обновить карточку</text>
<text x="959" y="458" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Ответ на нажатие</text>
<text x="959" y="478" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Статус + убрать кнопки</text>
<path d="M923 450 L942 450" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<text x="42" y="530" class="note" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#b8c6d8" font-weight="400">Недопустимое нажатие / старая версия / повторное решение → «Нажатие не принято». Запись не меняется.</text>
<rect x="25" y="592" width="1150" height="201" rx="16" fill="#142036" stroke="#243650" />
<text x="42" y="623" class="n" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#80aeff" font-weight="700">03  Реестр для просмотра</text>
<rect x="42" y="640" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="55" y="671" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Раз в 15 минут</text>
<text x="55" y="695" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Schedule Trigger</text>
<text x="55" y="715" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Или ручной запуск</text>
<rect x="268" y="640" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="281" y="671" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Прочитать базу</text>
<text x="281" y="695" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">PostgreSQL SELECT</text>
<text x="281" y="715" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Счета + мероприятия</text>
<path d="M245 687 L264 687" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<rect x="494" y="640" width="202" height="95" rx="12" fill="#1c2b43" stroke="#334b6e" />
<text x="507" y="671" class="t" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf4ff" font-weight="700">Google Sheets</text>
<text x="507" y="695" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Append or Update</text>
<text x="507" y="715" class="b" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#aabbd4" font-weight="400">Совпадение invoice_id</text>
<path d="M471 687 L490 687" fill="none" stroke="#7199d4" stroke-width="2" marker-end="url(#arrow)" />
<text x="42" y="767" class="note" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#b8c6d8" font-weight="400">Таблица показывает текущие записи. Правки в Google Sheets не изменяют PostgreSQL.</text>
<text x="38" y="828" class="s" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#9eacc3" font-weight="400">Схема составлена по экспортам workflow. ИИ извлекает данные; решения принимает заданная логика.</text></svg>